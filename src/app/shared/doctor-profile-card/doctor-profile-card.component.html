@if (doctor()) {
  <div class="card mb-1 shadow small border">
    <div class="doctor w-100 p-2 d-flex flex-row align-items-center">
      <div class="doc-image px-3">
        <img
          class="border border-1 border-secondary rounded-circle p-1"
          [ngSrc]="ipfs.getImageUrl(doctor()?.image) || 'assets/images/doctor.png'"
          alt="Doctor Image"
          width="150"
          height="150"
          priority
        />
      </div>
      <div class="doc-info d-flex flex-column text-secondary">
        <div class="col">
          <div class="row py-2">
            <div class="col-md-12">
              <b>DocID: </b>
              <span class="text-success">
                        <b>{{ doctor()?.docId }}</b></span>
            </div>
          </div>
          <div class="row-md-12 d-flex flex-row justify-content-between">
            <div class="col-md-12 d-flex flex-column">
              <div>
                <b>Full Name : </b>
                <span class="fName">{{ doctor()?.fName }} {{ doctor()?.lName }}</span>
              </div>
              <div>
                <b>Date of Joining : </b>
                <span class="Doj">{{ doctor()?.doj }}</span>
              </div>
              <div>
                <b>Speciality: </b>
                <span class="speciality">{{ doctor()?.speciality }}</span>
              </div>
            </div>
            <div class="col-md-12 d-flex flex-column">
              <div>
                <b>Email : </b>
                <span class="text-primary">{{ doctor()?.emailId }}</span>
              </div>
              <div>
                <b>Phone: </b>
                <span class="phone">{{ doctor()?.phone }}</span>
              </div>
              <div>
                <b>City: </b>
                <span class="city">{{ doctor()?.city }}</span>
              </div>
              <div>
                <b>State: </b>
                <span class="state">{{ doctor()?.state }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
}
