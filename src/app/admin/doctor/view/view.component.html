<div class="container-fluid">
  <div class="d-flex refresh-btn justify-content-end">
    <button class="btn btn-sm btn-primary" (click)="loadAllDoctors()">
      <i class="fa-solid fa-rotate-right"></i>
      <span class="ps-2">Refresh</span>
    </button>
  </div>
  <div class="container w-100 p-3">
    @if (DoctorDetails().length >= 1) {
      <div class="content py-3">
        @for (doc of DoctorDetails(); track doc) {
          <app-doctor-profile-card [doctor]="doc"></app-doctor-profile-card>
        }
      </div>
    } @else {
      @if (showProgressCard()) {
        <div class="mt-3 d-flex flex-column align-items-center">
          <label for="progress">{{ progressMsg() }}</label>
          <progress id="progress"></progress>
        </div>
      }
      @if (loadComplete() && !loaded()) {
        <div class="d-flex small text-center text-primary-emphasis">
          No Doctors In the Network Add Doctors using the above tab
          <span class="text-primary fw-bold ps-3">'Add Doctor'</span>
        </div>
      }
    }
  </div>
</div>
