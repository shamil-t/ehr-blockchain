<div class="container-fluid">
  <div class="container">
    <div class="row mt-2">
      @for (card of Titles; track card; let i = $index) {
        <div class="col-md-3">
          <app-card [background]="Background[i]" [title]="Titles[i]" [image]="Images[i]" [count]="Count"></app-card>
        </div>
      }
    </div>
    <div class="row mt-3">
      <div class="col-md-6">
        <app-card [title]="'Account Balance'" [count]="accountBalance() | currency:'ETH '"  [image]="'wallet'"></app-card>
      </div>
      <div class="col-md-6">
        <app-card [title]="'Total Earnings'" [count]="'ETH 0.00'" [image]="'money-check-alt'" [background]="'black-white'"></app-card>
      </div>
    </div>
  </div>
</div>
